name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Compiler l'APK (debug)
        run: gradle assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: quincaillerie-app
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Créer/mettre à jour le lien de téléchargement stable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dernière version"
          body: "Dernière version de l'application. Téléchargez le fichier .apk ci-dessous."
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
